name: Release

# Pushing a tag such as v0.2.0 builds the wheel and sdist and attaches them to a GitHub Release.
# Nothing is published to PyPI: Bunshō is a self-hosted personal app. To publish later, add a
# job with `environment: release` and `id-token: write` using pypa/gh-action-pypi-publish
# once a PyPI trusted publisher exists for the project.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  UV_VERSION: "0.12.17"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match pyproject.toml version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Full checks before releasing
        run: |
          uv run ruff check .
          uv run mypy src/
          uv run pytest --cov

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uv run twine check dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" dist/* --title "${TAG}" --generate-notes --verify-tag

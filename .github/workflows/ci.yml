name: CI

# Mirrors the local checks in .claude/CLAUDE.md: ruff, mypy, bandit, pytest with coverage.
# The `smoke` job builds the Docker image and runs scripts/smoke_test.py against the real deck.
# Frontend checks (tsc -b, eslint, vitest) arrive with Plan 2.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Japanese text in test output must not depend on the runner's console code page.
  PYTHONUTF8: "1"
  UV_VERSION: "0.12.17"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes exact release tags only (no floating major); pinned by commit.
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Lockfile is up to date
        run: uv lock --check

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: MyPy type check
        run: uv run mypy src/

      - name: Bandit security scan
        run: uv run bandit -r src/ -l

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --locked

      # Coverage settings (source, branch, fail_under = 90) live in pyproject.toml, and
      # pytest-cov fails the run when coverage drops below the threshold.
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        # Optional: only uploads when a CODECOV_TOKEN secret exists; never fails the build.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uv run twine check dist/*

      - name: Wheel installs and imports in a clean environment
        run: uv run --isolated --no-project --with dist/*.whl python -c "import bunsho; print(bunsho.__file__)"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --locked

      # Builds the image, logs in, builds content from the real deck and jamdict database,
      # restarts the container and checks the data survived. On failure the script prints the
      # container logs itself and always tears the stack down (docker compose down -v).
      - name: Container smoke test (real deck, real jamdict database)
        run: uv run python scripts/smoke_test.py

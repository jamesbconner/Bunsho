[project]
name = "bunsho"
version = "1.0.0"
description = "Bunshō (文章): a Japanese learning tool with kana, JLPT kanji and vocabulary, and spaced-repetition flashcards."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James", email = "jamesbconner@users.noreply.github.com" }]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "filelock>=3.32",
    "fsrs>=6.3.2",
    "jamdict>=0.1a11.post2",
    "jamdict-data-fix>=1.5.1a2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.0.54",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.9.4",
    "httpx2>=2.13.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "twine>=7.0.0",
]

[project.scripts]
bunsho = "bunsho.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bunsho"]

# An explicit include list, not an exclude list: a file added to the repository later (another
# deck, fixtures, data) stays out of the MIT-labelled sdist unless someone names it here.
# resources/ holds the GPL-3.0 vocabulary deck and must never ship in this artifact.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D", "S", "C4", "PT"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106"]
"scripts/**" = ["S310", "S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jamdict", "jamdict.*", "jamdict_data", "jamdict_data.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: cross-boundary tests that run the real application stack; some also need the real deck or the jamdict-data-fix database and skip without them"]

[tool.coverage.run]
source = ["src/bunsho"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]

[tool.bandit]
exclude_dirs = ["tests"]
